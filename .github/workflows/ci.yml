name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref (branch or PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI builds are closer to from-scratch than a local edit loop, where incremental
  # only adds dependency-tracking overhead and harms cache reuse.
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Cross-run object cache; complements rust-cache, which caches deps in target.
      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # Caches the registry and dependency artifacts only. Workspace crates are
      # rebuilt every run, so a fresh commit never restores stale ones.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Unused dependencies
        run: cargo machete

      - name: Clippy
        # --no-default-features skips the pdf-extract stack for a fast cold lint;
        # the test step builds the default (pdf) features.
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: Test
        run: cargo test --workspace

  # The web UI that the release binary embeds (apps/web/dist).
  web:
    name: web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # Independent of the check job: only needs the repository and a working
  # Docker daemon. Builds the image locally and never pushes it.
  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image (no push)
        run: docker build --tag silver:ci .

  # End-to-end against the deterministic mock provider in scripts/. These tests
  # make no real provider call; the scripts build the debug binaries themselves.
  e2e:
    name: end-to-end (mock provider)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # scripts/tools_e2e.sh forces these two paths, so the cache below must
      # match them exactly.
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo registry, git and target
        uses: actions/cache@v4
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
            target
          key: ${{ runner.os }}-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-e2e-

      - name: Build debug binaries
        run: cargo build -p silver

      - name: Run tools e2e
        run: |
          set -o pipefail
          bash scripts/tools_e2e.sh | tee /tmp/tools_e2e.log
          grep -q 'hi-from-bash' /tmp/tools_e2e.log
          grep -q 'tool_result:' /tmp/tools_e2e.log

      - name: Run bot chat e2e
        run: python3 scripts/chat_e2e.py

      - name: Run ai-memory capture e2e
        run: python3 scripts/ai_memory_e2e.py
