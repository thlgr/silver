[package]
name = "silver-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
silver-protocol = { path = "../silver-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "process", "fs", "io-util"] }
tokio-util = "0.7"
futures = "0.3"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
# search_files: small models write regex ("a|b", "free.tier", "import.*lite") into patterns.
regex = "1"
# read_file and search_documents extract a PDF's text; pure Rust, so no poppler is needed.
pdf-extract = "0.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
