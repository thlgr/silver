[workspace]
resolver = "2"
members = [
    "crates/silver-protocol",
    "crates/silver-core",
    "apps/silver",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "Unlicense"
rust-version = "1.88"

[profile.release]
lto = "thin"

# No debuginfo in dev: nothing here uses a debugger, and it dominates codegen,
# link time and target size. Re-add `debug = "line-tables-only"` (or a
# `debugging` profile) if that changes.
[profile.dev]
debug = false
